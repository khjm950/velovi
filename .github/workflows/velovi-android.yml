name: Velovi Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - chore/velovi-stability-apk
    paths:
      - '**'
      - '.github/workflows/velovi-android.yml'

permissions:
  contents: read

jobs:
  build-android:
    name: Build installable Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install exact project dependencies
        run: npm ci

      - name: Run Velovi integrity checks
        run: npm run check

      - name: Build Velovi web assets
        run: npm run build:web

      - name: Generate the native Android project
        run: npx cap add android

      - name: Sync Capacitor plugins and web assets
        run: npx cap sync android

      - name: Apply Velovi Android security and branding
        run: |
          node scripts/patch-android-manifest.mjs
          node scripts/patch-android-theme.mjs
          node scripts/patch-android-gradle.mjs

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK output
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: velovi-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
