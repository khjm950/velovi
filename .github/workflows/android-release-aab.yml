name: Velovi Google Play AAB
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-release-aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Install dependencies and stage web assets
        run: |
          npm install --no-audit --no-fund
          npm run check
          npm run build:web
      - name: Create and sync Android project
        run: |
          npx cap add android
          npx @capacitor/assets generate --android --iconBackgroundColor '#173f35' --splashBackgroundColor '#10241b'
          npx cap sync android
          node scripts/patch-android-manifest.mjs
          node scripts/patch-android-theme.mjs
          node scripts/patch-android-gradle.mjs
      - name: Prepare protected upload keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64" || (echo "Configure Android upload-key repository secrets first." && exit 1)
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/velovi-upload.jks"
          test -s "$RUNNER_TEMP/velovi-upload.jks"
      - name: Configure release signing
        env:
          VELOVI_KEYSTORE_PATH: ${{ runner.temp }}/velovi-upload.jks
          VELOVI_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          VELOVI_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          VELOVI_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: node scripts/configure-android-release-signing.mjs
      - name: Build signed Android App Bundle
        run: cd android && ./gradlew --no-daemon bundleRelease
      - name: Verify signed AAB
        run: |
          test -s android/app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify -verbose -certs android/app/build/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@v6
        with:
          name: velovi-google-play-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
