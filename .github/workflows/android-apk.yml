name: Velovi Android APK

on:
  push:
    branches:
      - chore/velovi-stability-apk
  workflow_dispatch:

concurrency:
  group: velovi-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: chore/velovi-stability-apk

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Generate and commit npm lockfile
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          if [ -f package-lock.json ]; then
            git add package-lock.json
            if ! git diff --cached --quiet -- package-lock.json; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git commit -m "chore: lock Android build dependencies [skip ci]"
              git push
            fi
          fi

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit pinned npm dependencies
        run: npm audit --audit-level=high

      - name: Run source integrity and syntax checks
        run: npm run check

      - name: Stage web application
        run: npm run build:web

      - name: Create Android project
        run: npx cap add android

      - name: Generate Velovi launcher and splash assets
        run: npx capacitor-assets generate --android --iconBackgroundColor '#173f35' --splashBackgroundColor '#10241b'

      - name: Sync Capacitor assets
        run: npx cap sync android

      - name: Harden Android manifest
        run: node scripts/patch-android-manifest.mjs

      - name: Apply Velovi Android theme
        run: node scripts/patch-android-theme.mjs

      - name: Build installable debug APK
        run: |
          cd android
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: velovi-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
