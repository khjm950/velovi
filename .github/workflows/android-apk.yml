name: Velovi Android APK
# Persistent signing secrets enable update-compatible release APK artifacts.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: velovi-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
      ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
      ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
      ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
    steps:
      - name: Check out the current source revision
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install pinned dependencies
        run: npm install --no-audit --no-fund

      - name: Check source syntax
        run: npm run check

      - name: Stage current web application
        run: npm run build:web

      - name: Create Android project
        run: npx cap add android

      - name: Generate Velovi launcher and splash assets
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#173f35' --splashBackgroundColor '#10241b'

      - name: Sync Capacitor assets
        run: npx cap sync android

      - name: Harden Android manifest
        run: node scripts/patch-android-manifest.mjs

      - name: Apply Velovi Android theme
        run: node scripts/patch-android-theme.mjs

      - name: Prepare persistent Android signing key when configured
        if: ${{ env.ANDROID_UPLOAD_KEYSTORE_BASE64 != '' && env.ANDROID_UPLOAD_KEYSTORE_PASSWORD != '' && env.ANDROID_UPLOAD_KEY_ALIAS != '' && env.ANDROID_UPLOAD_KEY_PASSWORD != '' }}
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/velovi-upload-key.jks"
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          echo "VELOVI_SIGNING_STORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "VELOVI_SIGNING_STORE_PASSWORD=$ANDROID_UPLOAD_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "VELOVI_SIGNING_KEY_ALIAS=$ANDROID_UPLOAD_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "VELOVI_SIGNING_KEY_PASSWORD=$ANDROID_UPLOAD_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Set Android package identity and version
        env:
          VELOVI_VERSION_CODE: ${{ github.run_number }}
        run: node scripts/patch-android-gradle.mjs

      - name: Build installable debug APK
        run: |
          cd android
          ./gradlew --no-daemon assembleDebug

      - name: Verify APK identity and signature
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          BADGING=$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK")
          echo "$BADGING"
          echo "$BADGING" | grep -F "package: name='com.velovi.familyfinance'"
          echo "$BADGING" | grep -F "versionName='1.0.0'"
          echo "$BADGING" | grep -F "application-label:'Velovi'"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"

      - name: Build persistent-key signed release APK
        if: ${{ env.ANDROID_UPLOAD_KEYSTORE_BASE64 != '' && env.ANDROID_UPLOAD_KEYSTORE_PASSWORD != '' && env.ANDROID_UPLOAD_KEY_ALIAS != '' && env.ANDROID_UPLOAD_KEY_PASSWORD != '' }}
        run: |
          cd android
          ./gradlew --no-daemon assembleRelease

      - name: Verify release APK identity and signature
        if: ${{ env.ANDROID_UPLOAD_KEYSTORE_BASE64 != '' && env.ANDROID_UPLOAD_KEYSTORE_PASSWORD != '' && env.ANDROID_UPLOAD_KEY_ALIAS != '' && env.ANDROID_UPLOAD_KEY_PASSWORD != '' }}
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          BADGING=$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK")
          echo "$BADGING"
          echo "$BADGING" | grep -F "package: name='com.velovi.familyfinance'"
          echo "$BADGING" | grep -F "versionName='1.0.0'"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"

      - name: Upload debug APK (temporary testing build)
        uses: actions/upload-artifact@v6
        with:
          name: velovi-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload update-compatible signed APK
        if: ${{ env.ANDROID_UPLOAD_KEYSTORE_BASE64 != '' && env.ANDROID_UPLOAD_KEYSTORE_PASSWORD != '' && env.ANDROID_UPLOAD_KEY_ALIAS != '' && env.ANDROID_UPLOAD_KEY_PASSWORD != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: velovi-update-signed-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
